name: Benchmark harness
on:
  pull_request:
    paths: ["benchmarks/**", "crates/**", ".github/workflows/benchmarks.yml", "Cargo.toml", "Cargo.lock"]
  push:
    branches: [main]
    paths: ["benchmarks/**", "crates/**", ".github/workflows/benchmarks.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path benchmarks/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path benchmarks/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path benchmarks/Cargo.toml --lib
      - run: python -m unittest discover -s benchmarks -p "test_*.py"
      - run: python benchmarks/run.py --backend portable --output benchmarks/results/portable-smoke -- --test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: benchmark-smoke-${{ matrix.os }}
          path: benchmarks/results/
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.85.0"
      - run: cargo check --locked --manifest-path benchmarks/Cargo.toml --all-targets --all-features
  openvino-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: Install the pinned CPU runtime
        run: |
          python -m venv /tmp/benchmark-runtime
          /tmp/benchmark-runtime/bin/python -m pip install openvino==2026.3.0
          /tmp/benchmark-runtime/bin/python -c 'import openvino,pathlib,os; p=next((pathlib.Path(openvino.__file__).parent/"libs").glob("libopenvino_c.so.*")); print("VIRTIO_ACCEL_OPENVINO_LIBRARY="+str(p))' >> "$GITHUB_ENV"
      - name: Validate every phase on a real CPU runtime
        run: python benchmarks/run.py --backend openvino --device CPU --case Nvfp4F16Decode --phase all --runtime-version 2026.3.0 --output benchmarks/results/openvino-smoke -- --test
      - name: Validate four simultaneous request slots
        run: python benchmarks/run.py --backend openvino --device CPU --case Nvfp4F16Decode --phase pipeline_execution --in-flight 4 --requests 32 --runtime-version 2026.3.0 --output benchmarks/results/openvino-pipeline -- --test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: benchmark-openvino-smoke
          path: benchmarks/results/
