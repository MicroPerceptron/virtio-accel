name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  style-and-api:
    name: style-and-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check fuzz formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

      - name: Check normative requirement ledger
        run: python3 ci/check-normative-requirements.py --check

      - name: Check performance budget manifests
        run: python3 ci/check-performance-budgets.py --check

      - name: Check release policy invariants
        run: python3 ci/check-release-policy.py

      - name: Test the publication driver
        run: python3 -m unittest discover -s ci -p 'test_*.py'

      - name: Check C wire header
        run: python3 ci/check-c-header.py

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  native-test:
    name: native-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features

      - name: Run backend conformance example
        run: cargo run --example backend_conformance

      - name: Run vAccel adapter conformance example
        run: cargo run -p virtio-accel-vaccel --example backend_conformance

      - name: Run reference execution example
        run: cargo run --example reference_execution

      - name: Run TOSA-to-Core ML example
        run: cargo run -p virtio-accel-coreml --example tosa_coreml

      - name: Run TOSA-to-OpenVINO example
        run: cargo run -p virtio-accel-openvino --example tosa_openvino

      - name: Run SDK-free TOSA-to-Hexagon example
        run: cargo run -p virtio-accel-hexagon --example tosa_hexagon

      - name: Run SDK-free Hexagon mock-classifier example
        run: cargo run -p virtio-accel-hexagon --example mock_classifier

      - name: Check release profile
        run: cargo check --workspace --release --all-features

  openvino-host-test:
    name: openvino-host-test (ubuntu, CPU plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The probe must find the runtime; a silent placeholder fallback would test nothing.
      VIRTIO_ACCEL_OPENVINO: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Install the pinned OpenVINO runtime from Intel's APT repository
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/intel-openvino.gpg
          echo "deb [signed-by=/usr/share/keyrings/intel-openvino.gpg] https://apt.repos.intel.com/openvino ubuntu24 main" \
            | sudo tee /etc/apt/sources.list.d/intel-openvino.list
          sudo apt-get update
          sudo apt-get install -y openvino-libraries-dev-2026.3.0

      - name: Locate the installed pkg-config metadata
        run: |
          pc_file="$(find /opt/intel /usr/lib /usr/share -name 'openvino.pc' 2>/dev/null | head -n1)"
          test -n "$pc_file"
          echo "PKG_CONFIG_PATH=$(dirname "$pc_file")" >> "$GITHUB_ENV"

      - name: Lint the probed backend
        run: cargo clippy -p virtio-accel-openvino --all-targets -- -D warnings

      - name: Test against the real runtime
        run: cargo test -p virtio-accel-openvino --all-targets

      - name: Run the example against the real runtime
        run: cargo run -p virtio-accel-openvino --example tosa_openvino

  freebsd-qemu-smoke:
    name: freebsd-qemu-smoke (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run FreeBSD QEMU portable smoke test
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1.5.3
        with:
          release: "14.4"
          usesh: true
          mem: 4096
          cpu: 3
          prepare: |
            pkg update
            pkg install -y rust git
          run: |
            cargo run --example backend_conformance

  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.85.0

      - name: Check every workspace target on MSRV
        run: cargo check --workspace --all-targets --all-features

      - name: Run tests on MSRV
        run: cargo test --workspace --all-features

  portable-target:
    name: portable-target (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-none
          - riscv64gc-unknown-none-elf
          - wasm32-unknown-unknown
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust and target
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Check no_std and alloc portable crates
        run: >-
          cargo check
          -p virtio-accel-cleanroom
          -p virtio-accel-proto
          -p virtio-accel-transport
          -p virtio-accel-core
          -p virtio-accel-device
          -p virtio-accel-guest
          -p virtio-accel-split-queue
          -p virtio-accel-tosa
          -p virtio-accel
          -p virtio-accel-vaccel
          --target ${{ matrix.target }}
          --no-default-features

      - name: Check std reference code on Wasm
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check --workspace --target wasm32-unknown-unknown --all-features

  feature-sets:
    name: feature-sets-and-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-hack@0.6.45
          fallback: none

      - name: Check feature powerset
        run: cargo hack check --workspace --feature-powerset --no-dev-deps

      - name: Check portable dependency features
        run: bash ci/check-portable-dependencies.sh

  publish-dry-run:
    name: publish-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      # Packages every published crate in documented order into an isolated local registry, then
      # builds, tests, and documents each one from its extracted tarball. `cargo package`'s own
      # verify step only builds the library target, which is how four cross-package `include_str!`
      # sites went unnoticed; this job runs the tests inside the packaged source instead.
      - name: Run the ordered publication dry run
        run: python3 ci/publish-dry-run.py

  dependency-policy:
    name: dependency-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.85.0"
          command: check
          arguments: --workspace --all-features

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-13

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Test shared fuzz harness
        run: cargo test --manifest-path fuzz/Cargo.toml --lib --no-default-features

      - name: Generate deterministic seed corpus
        run: python3 ci/seed-fuzz-corpus.py

      - name: Run bounded smoke iterations
        shell: bash
        run: |
          mapfile -t targets < <(cargo fuzz list)
          if (( ${#targets[@]} == 0 )); then
            echo "fuzz/Cargo.toml exists but defines no fuzz targets" >&2
            exit 1
          fi
          for target in "${targets[@]}"; do
            corpora=("fuzz/corpus/$target")
            if [[ -d "fuzz/regressions/$target" ]]; then
              corpora+=("fuzz/regressions/$target")
            fi
            cargo fuzz run "$target" "${corpora[@]}" -- -runs=256 -max_total_time=20 -timeout=5 -rss_limit_mb=2048 -max_len=65536
          done
