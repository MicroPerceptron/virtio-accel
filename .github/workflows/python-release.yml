name: Release Python SDK
run-name: Python SDK · ${{ inputs.destination || 'pypi' }} · ${{ github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      destination:
        description: Build artifacts, publish to TestPyPI, or publish a tagged PyPI release
        type: choice
        options: [artifacts, testpypi, pypi]
        default: artifacts

permissions:
  contents: read

concurrency:
  group: python-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'python-v')
    runs-on: ubuntu-24.04
    outputs:
      destination: ${{ steps.release.outputs.destination }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Publish only commits already included in the default branch.
      - name: Require a reviewed commit on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - name: Validate release version and destination
        id: release
        env:
          DESTINATION: ${{ inputs.destination || 'pypi' }}
        run: |
          python python/scripts/check_release.py ref --destination "$DESTINATION" --ref "$GITHUB_REF"
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"
          {
            echo "## Python SDK release"
            echo "Destination: **$DESTINATION**"
            if [ "$DESTINATION" = artifacts ]; then
              echo "Build-only run: publishing is deliberately skipped."
              echo "To publish, create a GitHub release with the matching python-v tag, or start a new run on that tag with destination pypi. Re-running this run keeps artifacts mode."
            elif [ "$DESTINATION" = pypi ]; then
              echo "After the PyPI upload succeeds, Website automatically rebuilds and deploys current main."
            else
              echo "TestPyPI upload only; the production website is not refreshed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  wheels:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-26
            name: macos-arm64
          - os: macos-26-intel
            name: macos-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin[zig]>=1.16,<2" "twine>=6,<7"
      - name: Build portable Linux wheel
        if: runner.os == 'Linux'
        run: maturin build --release --locked --manifest-path python/Cargo.toml --out dist --strip --zig --compatibility manylinux_2_28 --auditwheel check
      - name: Build macOS or Windows wheel
        if: runner.os != 'Linux'
        run: maturin build --release --locked --manifest-path python/Cargo.toml --out dist --strip
      - name: Verify and test installed wheel
        shell: bash
        run: |
          python python/scripts/check_release.py artifacts dist
          python -m twine check --strict dist/*
          python -m pip install dist/*.whl
          python python/scripts/check_release.py installed
          python -m unittest discover -s python/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  source:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin>=1.16,<2" "twine>=6,<7"
      - run: maturin sdist --manifest-path python/Cargo.toml --out dist
      - run: python python/scripts/check_release.py artifacts dist
      - run: python -m twine check --strict dist/*
      - name: Rebuild and install solely from the source archive
        run: |
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
          python -m pip install rebuilt/*.whl
          python python/scripts/check_release.py installed
          python -m unittest discover -s python/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-source
          path: dist/*
          if-no-files-found: error

  verify:
    needs: [wheels, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - run: python python/scripts/check_release.py artifacts dist --complete

  publish:
    needs: [prepare, verify]
    if: needs.prepare.outputs.destination != 'artifacts'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.prepare.outputs.destination }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - name: Publish to TestPyPI
        if: needs.prepare.outputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      # website/release_trigger.py identifies a production upload by this step name.
      - name: Publish to PyPI
        if: needs.prepare.outputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
