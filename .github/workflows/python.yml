name: Python frontend

on:
  pull_request:
    paths:
      - "python/**"
      - "crates/virtio-accel-tosa/**"
      - "crates/virtio-accel-tosa-build/**"
      - "crates/virtio-accel-core/**"
      - "crates/virtio-accel-coreml/**"
      - "crates/virtio-accel-vulkan/**"
      - "crates/virtio-accel-openvino/**"
      - "crates/virtio-accel-hexagon/**"
      - "crates/virtio-accel-xdna/**"
      - "crates/virtio-accel-transport/**"
      - "Cargo.toml"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.13"
            runtime: openvino
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate the Windows hardware runner
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/python/scripts/test-hexagon.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          # Hosted Windows is x64. Verify a wrong-architecture invocation fails
          # before cloning/building and still produces the promised report/log ZIP.
          $testDir = Join-Path $env:RUNNER_TEMP ('hexagon-preflight-' + [guid]::NewGuid().ToString('N'))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File python/scripts/test-hexagon.ps1 `
            -WorkDirectory $testDir -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 1) { throw 'Expected wrong-architecture preflight to fail' }
          $report = Get-Content "$testDir/logs/report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne 'failed' -or $report.error -notlike '*Native ARM64 Python is required*') {
            throw ($report | ConvertTo-Json -Depth 8)
          }
          if (-not (Test-Path "$testDir/hexagon-results.zip")) { throw 'Missing diagnostic ZIP' }
          $global:LASTEXITCODE = 0
      - name: Install OpenVINO for the native CPU execution lane
        if: matrix.runtime == 'openvino'
        shell: bash
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/intel-openvino.gpg
          echo "deb [signed-by=/usr/share/keyrings/intel-openvino.gpg] https://apt.repos.intel.com/openvino ubuntu24 main" \
            | sudo tee /etc/apt/sources.list.d/intel-openvino.list
          sudo apt-get update
          sudo apt-get install -y openvino-libraries-dev-2026.3.0
          pkg-config --modversion openvino
          echo "VIRTIO_ACCEL_OPENVINO=1" >> "$GITHUB_ENV"
          echo "VIRTIO_ACCEL_PYTHON_TEST_DEVICE=cpu" >> "$GITHUB_ENV"
      - run: python -m pip install "maturin>=1.8,<2"
      - run: cargo fmt --manifest-path python/Cargo.toml -- --check
      - run: cargo test --manifest-path python/Cargo.toml
      - run: cargo clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings
      - name: Build the platform wheel
        if: matrix.runtime != 'openvino'
        run: maturin build --release --manifest-path python/Cargo.toml --out dist
      - name: Build against the installed OpenVINO runtime without bundling vendor libraries
        if: matrix.runtime == 'openvino'
        run: maturin build --release --manifest-path python/Cargo.toml --out dist --compatibility linux --auditwheel skip
      - name: Install and exercise wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -c "from virtio_accel._native import build_tosa; assert callable(build_tosa)"
          if [ "${{ matrix.runtime }}" = "openvino" ]; then
            python -c "import virtio_accel as va; assert va.devices('cpu', provider='openvino')"
          fi
          python -m unittest discover -s python/tests -v

