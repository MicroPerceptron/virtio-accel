name: Python frontend

on:
  pull_request:
    paths:
      - "python/**"
      - "pyproject.toml"
      - ".github/workflows/python-release.yml"
      - "crates/virtio-accel-tosa/**"
      - "crates/virtio-accel-tosa-build/**"
      - "crates/virtio-accel-core/**"
      - "crates/virtio-accel-coreml/**"
      - "crates/virtio-accel-vulkan/**"
      - "crates/virtio-accel-openvino/**"
      - "crates/virtio-accel-hexagon/**"
      - "crates/virtio-accel-xdna/**"
      - "crates/virtio-accel-transport/**"
      - "Cargo.toml"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - "pyproject.toml"
      - ".github/workflows/python-release.yml"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.13"
            runtime: openvino
          - os: windows-latest
            python: "3.13"
            runtime: openvino
          - os: ubuntu-24.04-arm
            python: "3.14"
          - os: macos-26-intel
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate the manual Hexagon test script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/python/scripts/test-hexagon.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          # Hosted Windows is x64. Verify a wrong-architecture invocation fails
          # before cloning/building and still produces the promised report/log ZIP.
          $testDir = Join-Path $env:RUNNER_TEMP ('hexagon-preflight-' + [guid]::NewGuid().ToString('N'))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File python/scripts/test-hexagon.ps1 `
            -WorkDirectory $testDir -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 1) { throw 'Expected wrong-architecture preflight to fail' }
          $report = Get-Content "$testDir/logs/report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne 'failed' -or $report.error -notlike '*Native ARM64 Python is required*') {
            throw ($report | ConvertTo-Json -Depth 8)
          }
          if (-not (Test-Path "$testDir/hexagon-results.zip")) { throw 'Missing diagnostic ZIP' }
          $global:LASTEXITCODE = 0
      - run: python -m pip install "maturin[zig]>=1.16,<2" "twine>=6,<7"
      - run: cargo fmt --manifest-path python/Cargo.toml -- --check
      - run: cargo test --manifest-path python/Cargo.toml
      - run: cargo clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings
      - name: Build portable Linux wheel without a vendor SDK
        if: runner.os == 'Linux'
        run: maturin build --release --locked --manifest-path python/Cargo.toml --out dist --zig --compatibility manylinux_2_28 --auditwheel check
      - name: Build macOS or Windows wheel
        if: runner.os != 'Linux'
        run: maturin build --release --locked --manifest-path python/Cargo.toml --out dist
      - name: Install OpenVINO only after building the wheel
        if: matrix.runtime == 'openvino'
        shell: bash
        run: |
          python -m pip install 'openvino>=2026.3,<2027'
          echo "VIRTIO_ACCEL_PYTHON_TEST_PROVIDER=openvino" >> "$GITHUB_ENV"
          echo "VIRTIO_ACCEL_PYTHON_TEST_DEVICE=cpu" >> "$GITHUB_ENV"
      - name: Install and exercise wheel
        shell: bash
        run: |
          python python/scripts/check_release.py artifacts dist
          python -m twine check --strict dist/*
          python -m pip install dist/*.whl
          python python/scripts/check_release.py installed
          python -c "from virtio_accel._native import build_tosa; assert callable(build_tosa)"
          if [ "${{ matrix.runtime }}" = "openvino" ]; then
            python -c "import virtio_accel as va; assert va.devices('cpu', provider='openvino')"
          fi
          python -m unittest discover -s python/tests -v


  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin>=1.16,<2" "twine>=6,<7"
      - run: python -m unittest discover -s python/scripts -p 'test_*.py' -v
      - run: maturin sdist --manifest-path python/Cargo.toml --out dist
      - run: python python/scripts/check_release.py artifacts dist
      - run: python -m twine check --strict dist/*
      - name: Build and test the standalone source archive
        run: |
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
          python -m pip install rebuilt/*.whl
          python python/scripts/check_release.py installed
          python -m unittest discover -s python/tests -v
