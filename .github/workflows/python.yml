name: Python frontend

on:
  pull_request:
    paths:
      - "python/**"
      - "crates/virtio-accel-tosa/**"
      - "crates/virtio-accel-tosa-build/**"
      - "crates/virtio-accel-core/**"
      - "crates/virtio-accel-transport/**"
      - "Cargo.toml"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install "maturin>=1.8,<2"
      - run: cargo fmt --manifest-path python/Cargo.toml -- --check
      - run: cargo test --manifest-path python/Cargo.toml
      - run: cargo clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings
      - run: maturin build --release --manifest-path python/Cargo.toml --out dist
      - name: Install and exercise wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -c "from virtio_accel._native import build_tosa; assert callable(build_tosa)"
          python -m unittest discover -s python/tests -v

