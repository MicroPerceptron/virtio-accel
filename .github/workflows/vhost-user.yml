name: vhost-user host

on:
  pull_request:
    paths:
      - 'host/vhost-user/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vhost-user.yml'
      - '.github/actions/qemu/**'
  push:
    branches: [main]
    paths:
      - 'host/vhost-user/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vhost-user.yml'
      - '.github/actions/qemu/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vhost-user-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Check host formatting and lint
        run: |
          cargo fmt --manifest-path host/vhost-user/Cargo.toml -- --check
          cargo clippy --manifest-path host/vhost-user/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Test host contracts
        run: cargo test --manifest-path host/vhost-user/Cargo.toml --locked --all-features
      - name: Install QEMU build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libglib2.0-dev python3-venv
      - name: Build experimental QEMU frontend
        uses: ./.github/actions/qemu
        with:
          target: aarch64
      - name: Exercise real QEMU queues and reference execution
        run: |
          cargo build --manifest-path host/vhost-user/Cargo.toml --locked
          python3 host/vhost-user/tests/qemu-smoke.py --qemu "$RUNNER_TEMP/qemu/build/qemu-system-aarch64"
      - name: Check minimum Rust version
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --manifest-path host/vhost-user/Cargo.toml --locked --all-targets --all-features
