name: Website

"on":
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/website.yml"
  # Every pull request that can change what the site publishes rebuilds it, so
  # a broken doc, a dangling cross-link, or a rustdoc failure fails the PR
  # instead of landing on virtio-accel.org after the merge.
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/website.yml"
  workflow_run:
    workflows:
      - "Publish crates"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancel one in flight -- a half-finished
# rsync would leave the served tree inconsistent. Pull-request builds are keyed
# per-ref instead, and superseded pushes to a PR are cancelled.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('website-pr-{0}', github.ref)
    || 'website-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: "0.5.4"

jobs:
  # Pull-request validation. Builds exactly what a push to main would publish
  # and stops there: no artifact, no deploy, and no permissions beyond
  # `contents: read`.
  check:
    name: check-site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Install mdBook
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}
          fallback: none

      - name: Build the site
        run: python3 website/build.py

      - name: Check the built tree
        run: python3 website/check.py

  build:
    name: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Install mdBook
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}
          fallback: none

      - name: Build the site
        run: python3 website/build.py

      - name: Check the built tree
        run: python3 website/check.py

      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website
          path: website/book/
          if-no-files-found: error
          retention-days: 7

  # The site is static, so nothing is built on the droplet: the deploy is an
  # rsync of the tree the build job already produced. The droplet needs nginx
  # and rsync, and no Rust, mdBook, Python, or Docker.
  deploy:
    name: deploy-droplet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success')
    environment: production
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USERNAME: ${{ secrets.DEPLOY_SSH_USERNAME }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || vars.DEPLOY_SSH_PORT || 22 }}
      # Deliberately has no default. The previous droplet workflow hardcoded
      # one, which is how a deploy can quietly land in the wrong directory.
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
    steps:
      - name: Verify deploy configuration
        env:
          DEPLOY_SSH_SECRET: ${{ secrets.DEPLOY_SSH_SECRET }}
        run: |
          missing=0
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_USERNAME DEPLOY_SSH_SECRET DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions config: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add these under Settings -> Secrets and variables -> Actions," >&2
            echo "either repository-wide or on the 'production' environment:" >&2
            echo "  DEPLOY_SSH_HOST      droplet IP or hostname" >&2
            echo "  DEPLOY_SSH_USERNAME  SSH login user, e.g. deploy" >&2
            echo "  DEPLOY_SSH_SECRET    private key PEM for that user, no passphrase" >&2
            echo "  DEPLOY_PATH          absolute web root, e.g. /var/www/virtio-accel.org" >&2
            echo "DEPLOY_PATH and DEPLOY_SSH_PORT may be variables instead of secrets." >&2
            exit 1
          fi
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "::error::DEPLOY_PATH must be absolute, got: ${DEPLOY_PATH}"; exit 1 ;;
          esac

      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website
          path: book/

      - name: Authorize the droplet
        env:
          DEPLOY_SSH_SECRET: ${{ secrets.DEPLOY_SSH_SECRET }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_SECRET" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
            # Pinned host key: the run fails rather than trusting a substituted
            # host. Get the value with `ssh-keyscan -p <port> <host>`.
            printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_SSH_KNOWN_HOSTS is not set; trusting the host key on first sight."
            ssh-keyscan -p "$DEPLOY_SSH_PORT" "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Check the target directory
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" -o IdentitiesOnly=yes \
            "${DEPLOY_SSH_USERNAME}@${DEPLOY_SSH_HOST}" \
            "set -eu
             if [ ! -d '${DEPLOY_PATH}' ]; then
               echo \"DEPLOY_PATH does not exist: ${DEPLOY_PATH}\" >&2
               echo \"On the droplet, as root: mkdir -p '${DEPLOY_PATH}' && chown -R \$(whoami): '${DEPLOY_PATH}'\" >&2
               exit 1
             fi
             if [ ! -w '${DEPLOY_PATH}' ] || [ ! -x '${DEPLOY_PATH}' ]; then
               echo \"DEPLOY_PATH is not writable by \$(whoami): ${DEPLOY_PATH}\" >&2
               exit 1
             fi"

      # `--delete` makes the served tree exactly mirror the build, so a page
      # removed from SUMMARY.md stops being served instead of lingering.
      # `.well-known` is excluded because certbot writes ACME challenges there
      # and --delete would race them.
      - name: Sync the site to the droplet
        run: |
          rsync -az --delete --checksum \
            --exclude '.well-known' \
            -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_SSH_PORT} -o IdentitiesOnly=yes" \
            book/ "${DEPLOY_SSH_USERNAME}@${DEPLOY_SSH_HOST}:${DEPLOY_PATH}/"

      - name: Verify the deployed site responds
        run: |
          for attempt in 1 2 3; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://virtio-accel.org/ || echo 000)"
            if [ "$code" = "200" ]; then
              echo "virtio-accel.org returned 200"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 5
          done
          echo "::warning::virtio-accel.org did not return 200 after the deploy (last status ${code}). The files synced; check nginx and DNS."
