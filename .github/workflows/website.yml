name: Website

"on":
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/website.yml"
  workflow_run:
    workflows:
      - "Publish crates"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked

      - name: Build the site
        run: python3 website/build.py

      - name: Upload the site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website
          path: website/book/
          if-no-files-found: error

  deploy:
    name: deploy-droplet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          SSH_KEY: ${{ secrets.DO_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "Deploy secrets are not configured; skipping deploy." >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the site
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website
          path: book/

      - name: Set up the deploy SSH key
        if: steps.secrets.outputs.configured == 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DO_DEPLOY_SSH_KEY }}

      - name: Sync the site to the droplet
        if: steps.secrets.outputs.configured == 'true'
        env:
          DO_DEPLOY_HOST: ${{ secrets.DO_DEPLOY_HOST }}
          DO_DEPLOY_USER: ${{ secrets.DO_DEPLOY_USER }}
          DO_DEPLOY_PORT: ${{ secrets.DO_DEPLOY_PORT }}
          DO_DEPLOY_PATH: ${{ secrets.DO_DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -p ${DO_DEPLOY_PORT} -o StrictHostKeyChecking=accept-new" \
            book/ "${DO_DEPLOY_USER}@${DO_DEPLOY_HOST}:${DO_DEPLOY_PATH}/"
