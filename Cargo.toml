[package]
name = "virtio-accel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Portable Rust foundations for a virtio accelerator device"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/docs/**",
    "/conformance/v1.0/**",
]

[workspace]
members = [
    "conformance/rust-clean-room",
    "crates/virtio-accel-conformance",
    "crates/virtio-accel-core",
    "crates/virtio-accel-device",
    "crates/virtio-accel-guest",
    "crates/virtio-accel-mock",
    "crates/virtio-accel-proto",
    "crates/virtio-accel-split-queue",
    "crates/virtio-accel-transport",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/MicroPerceptron/virtio-accel"
homepage = "https://github.com/MicroPerceptron/virtio-accel"
keywords = ["virtio", "accelerator", "npu", "no-std", "protocol"]
categories = ["no-std", "hardware-support", "virtualization"]

[workspace.dependencies]
bitflags = { version = "2.13.1", default-features = false }
serde_json = "1.0.149"
zerocopy = { version = "0.8.54", default-features = false, features = ["derive"] }
virtio-accel-core = { path = "crates/virtio-accel-core", version = "0.1.0" }
virtio-accel-cleanroom = { path = "conformance/rust-clean-room", version = "0.1.0" }
virtio-accel-conformance = { path = "crates/virtio-accel-conformance", version = "0.1.0" }
virtio-accel-device = { path = "crates/virtio-accel-device", version = "0.1.0" }
virtio-accel-guest = { path = "crates/virtio-accel-guest", version = "0.1.0" }
virtio-accel-mock = { path = "crates/virtio-accel-mock", version = "0.1.0" }
virtio-accel-proto = { path = "crates/virtio-accel-proto", version = "0.1.0" }
virtio-accel-split-queue = { path = "crates/virtio-accel-split-queue", version = "0.1.0" }
virtio-accel-transport = { path = "crates/virtio-accel-transport", version = "0.1.0" }

[dependencies]
virtio-accel-core.workspace = true
virtio-accel-device.workspace = true
virtio-accel-guest.workspace = true
virtio-accel-proto.workspace = true
virtio-accel-split-queue.workspace = true
virtio-accel-transport.workspace = true

[dev-dependencies]
serde_json.workspace = true
virtio-accel-cleanroom.workspace = true
virtio-accel-conformance.workspace = true
virtio-accel-mock.workspace = true
zerocopy.workspace = true
