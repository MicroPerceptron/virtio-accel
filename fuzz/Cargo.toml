[package]
name = "virtio-accel-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
resolver = "3"

[features]
default = ["fuzzing"]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
virtio-accel-cleanroom = { path = "../conformance/rust-clean-room" }
virtio-accel-core = { path = "../crates/virtio-accel-core" }
virtio-accel-device = { path = "../crates/virtio-accel-device" }
virtio-accel-mock = { path = "../crates/virtio-accel-mock" }
virtio-accel-proto = { path = "../crates/virtio-accel-proto" }
virtio-accel-split-queue = { path = "../crates/virtio-accel-split-queue" }
virtio-accel-transport = { path = "../crates/virtio-accel-transport" }
zerocopy = { version = "0.8.54", default-features = false, features = ["derive"] }

[[bin]]
name = "protocol_decode"
path = "fuzz_targets/protocol_decode.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "descriptor_end_to_end"
path = "fuzz_targets/descriptor_end_to_end.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "stateful_commands"
path = "fuzz_targets/stateful_commands.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]
