[package]
name = "virtio-accel-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# Keep Python's build/dependency policy out of the portable workspace.
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
virtio-accel-tosa = { path = "../crates/virtio-accel-tosa" }
virtio-accel-tosa-build = { path = "../crates/virtio-accel-tosa-build" }

