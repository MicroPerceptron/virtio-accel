# nginx site for virtio-accel.org. Install as
# /etc/nginx/sites-available/virtio-accel.org, link it into sites-enabled/,
# and remove sites-enabled/default. See "Droplet setup" in website/README.md.
#
# It serves the static tree that .github/workflows/website.yml rsyncs to
# DEPLOY_PATH and nothing else. `root` below must be that same path.
#
# Lines marked "managed by Certbot" are the ones `certbot --nginx` wrote. Keep
# them when editing: certbot renews the files they point at, and its HTTP-01
# challenge needs the port-80 block that names virtio-accel.org.

# Files with a content hash in their name never change, so they are cached for
# good: mdBook's `name-<8 hex>` assets and everything rustdoc puts under
# static.files/. Every other response has to be revalidated. A deploy replaces
# HTML that points at new hashes and deletes the old hashed files, so a page
# served from a heuristic cache would reference assets that no longer exist.
map $uri $virtio_accel_cache_control {
    default                                         "no-cache";
    "~-[0-9a-f]{8}(\.min)?\.(css|js|svg|woff2)$"    "public, max-age=31536000, immutable";
    "~^/api/static\.files/"                         "public, max-age=31536000, immutable";
}

# Requests that are not for virtio-accel.org: address scans and stray Host
# headers. Drop them rather than serve the site, or a certificate that does
# not match, under a name nobody chose.
#
# As the default server for port 443 this block also fixes the TLS protocol
# versions for every name on the socket, so it takes certbot's settings too;
# without them the stock nginx.conf list, which still names TLS 1.0, applies.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_reject_handshake on;
    return 444;
}

server {
    server_name virtio-accel.org; # managed by Certbot

    root /var/www/virtio-accel.org;
    index index.html;
    server_tokens off;

    # No includeSubDomains: www is not served from here.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $virtio_accel_cache_control;

    # The stock nginx.conf only compresses text/html. The search indexes and
    # stylesheets are the bulk of a page load. Nothing here is secret or
    # reflects request input, so compressing over TLS is safe.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Build leftovers such as .buildinfo are not part of the site.
    # .well-known stays reachable for ACME.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # A directory without an index.html (/docs/) is "forbidden" to nginx.
    # To a visitor it is simply not a page.
    error_page 403 404 =404 /404.html;

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/virtio-accel.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/virtio-accel.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = virtio-accel.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name virtio-accel.org;
    return 404; # managed by Certbot
}
